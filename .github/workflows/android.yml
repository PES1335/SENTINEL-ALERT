name: Fabriquer l'appli Android Sentinel

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fabriquer l'APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publier l'APK en téléchargement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk sentinel.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk sentinel.apk --target "${{ github.sha }}" --title "Sentinel pour Android" --notes "Télécharge sentinel.apk sur ton téléphone puis ouvre-le pour l'installer."

      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-apk
          path: sentinel.apk
